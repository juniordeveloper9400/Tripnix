name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter Web App
        run: |
          cd frontend
          flutter pub get
          flutter build web --release --no-wasm-dry-run

      - name: Build Admin Portal
        run: |
          cd admin
          npm ci
          npm run build

      - name: Assemble Deployment Dist
        run: |
          mkdir -p dist/admin dist/public
          cp -R frontend/build/web/. dist/
          cp -R admin/dist/. dist/admin/
          cp -R backend/public/. dist/public/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages Action
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
